# ---- Kernel ----------------------------------------------------------------
# LVGL's timer handler runs on the main thread and the widget tree is built
# there too, so main needs more than the default 1 KiB.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Required for LVGL's own sanity checks to do anything: the Zephyr glue maps
# LV_ASSERT_HANDLER onto __ASSERT_NO_MSG(), which compiles away without this.
# Notably LV_ASSERT_MALLOC -- without CONFIG_ASSERT an exhausted LVGL heap
# hands out a half-built object and the fault surfaces later, somewhere else,
# as a bus error on a garbage style pointer.
CONFIG_ASSERT=y

# ---- Display: SSD1306 128x64 mono OLED on i2c0 -----------------------------
# The panel is picked up from the board's `chosen { zephyr,display = &oled; }`.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# ---- Input: rotary encoder (gpio-qdec) + buttons (gpio-keys) ---------------
# The buttons feed the Buttons/Enc screen through the input subsystem rather
# than being read as GPIOs, so what it shows is what the input layer reports.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_QDEC=y
CONFIG_INPUT_GPIO_KEYS=y

# ---- The rest of the board -------------------------------------------------
CONFIG_ADC=y

CONFIG_PWM=y
CONFIG_PWM_RPI_PICO=y

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_RPI_PICO_PIO=y

CONFIG_SPI=y

CONFIG_SENSOR=y
CONFIG_TMP1075=y
CONFIG_BMI323=y

# ---- LVGL ------------------------------------------------------------------
CONFIG_LVGL=y

# 1 bpp rendering. The panel is column-major ("vtiled"), 8 rows per page; the
# Zephyr LVGL glue rounds every redraw area to those page boundaries and packs
# the bits in lvgl_display_mono.c, so nothing here has to know about it.
CONFIG_LV_COLOR_DEPTH_1=y
# The SSD1306 inverts in hardware (display_set_pixel_format), so LVGL can skip
# doing it in software.
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
# A whole 128x64 1bpp frame is only 1 KiB, so render the full screen at once
# instead of tile by tile -- simpler and no partial-refresh tearing.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=110

# Every screen is built up front and kept, so the pool has to hold all twelve
# at once. Measured with `lvgl stats memory` in the debug build: 34 KiB
# allocated, so this leaves a bit under half spare for a few more modules.
# Do not shave it close -- running out is not graceful, it hands out a
# half-built widget (see CONFIG_ASSERT above).
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# UNSCII 8 is a crisp 1 bpp bitmap font: no anti-aliasing to threshold away,
# and it lays the screen out as an exact 16x8 character grid.
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y

# The widgets used (label, button, bar, flex layout) are all on by default, as
# is LV_USE_THEME_MONO -- LVGL picks the monochrome theme automatically at
# 1 bpp, which is why nothing here selects a theme. Turning the unused widgets
# off is the first place to look if the image needs to shrink.
