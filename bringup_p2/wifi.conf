# Applied on top of prj.conf for the Wi-Fi build, which is the only one where
# these symbols have their dependencies met:
#
#   west build -b zbook@p2/rp2350b/m33 samples/bringup_p2 \
#       --shield zbook_wifi -S zbook-wifi-credentials-littlefs \
#       -- -DEXTRA_CONF_FILE=wifi.conf
#
# The snippet is what puts the credentials in flash (settings on LittleFS at
# /lfs, on the board's `storage` partition). Store them once from the shell:
#
#   wifi cred add -s <SSID> -p <PSK> -k 1
#   wifi cred auto_connect
#
# They survive a reboot and a reflash of the application, and never appear in
# the source tree.

# Connect on boot using whatever is in flash, so "goes online" needs no
# intervention after the one-time `wifi cred add`.
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_WIFI_CREDENTIALS_SHELL=y

# Clock from SNTP once the link comes up. NET_CONNECTION_MANAGER (on by default
# from the shield) is what raises the L4-connected event this hangs off.
CONFIG_SNTP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# A DNS server has to be configured statically here. The ESP8266 offloads the
# IP stack and runs its own DHCP client, so the lease -- address, gateway and
# the DNS servers with it -- is negotiated inside the module and never reaches
# Zephyr's resolver. `net dns` then lists no servers and every name lookup
# fails with -EAGAIN, which is what SNTP reports. The esp_at driver offloads
# sockets but not getaddrinfo, so nothing else picks up the slack.
#
# A public resolver rather than the gateway, so this works on any network.
# Change it to your own if you would rather not talk to Google.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8:53"
