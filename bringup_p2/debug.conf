# Diagnostic overlay: adds an interactive shell on the console UART, for when
# a module misbehaves and the menu alone is not enough.
#
#   just run-debug
#
#   i2c scan i2c0        # ssd1306 answers at 0x3c, tmp1075 would at 0x48
#   device list          # every driver's probe result, in one place
#   input dump on        # raw input events: buttons and encoder
#   lvgl stats           # LVGL heap use -- check before trimming the pool size
#   cfb init && cfb invert
#                        # drives the panel with display_write() directly, so a
#                        # blank screen here means panel or driver, and a blank
#                        # screen only under LVGL means LVGL
#
# Verbose logging as well. The i2c driver's DBG output is per-transfer and
# drowns everything else, so it stays at ERR.

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_I2C_SHELL=y
CONFIG_INPUT_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_LV_Z_SHELL=y

CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_SHELL=y

CONFIG_LOG_MODE_MINIMAL=n
CONFIG_I2C_LOG_LEVEL_ERR=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
